name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # A newer push supersedes an older run on a PR, but every commit on main gets
  # its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: shelf-ci
      GIT_AUTHOR_EMAIL: ci@shelf.invalid
      GIT_COMMITTER_NAME: shelf-ci
      GIT_COMMITTER_EMAIL: ci@shelf.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The e2e tests pack the CLI, and packing builds the registry site.
      - run: bun install --frozen-lockfile --cwd apps/registry
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      # The apps install the CLI from packages/cli, including its built dist/.
      - run: bun run --cwd packages/cli build
      - name: apps/registry
        run: bun install --frozen-lockfile && bun run check
        working-directory: apps/registry
      - name: apps/example
        run: bun install --frozen-lockfile && bun run check
        working-directory: apps/example
      - name: apps/web
        run: bun install --frozen-lockfile && bun run check
        working-directory: apps/web
