name: Shelf Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so every revision a project installed can be rebuilt.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd apps/registry
      - run: bun run storybook:build
      - run: bun run site:build
      - name: Docs topics for `shelf docs`
        run: bun scripts/agent-docs.ts
        working-directory: apps/web
        env:
          NODE_ENV: production
      - name: Usage
        run: bun packages/cli/src/index.ts usage apps examples/acme --registry registry --json > usage.json
      - name: Build the registry
        run: >
          bun packages/cli/src/index.ts build registry --out dist/registry
          --storybook storybook-static --usage usage.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/registry

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
